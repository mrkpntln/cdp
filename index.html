g{display:block;font-size:24px;margin-top:7px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{background:#f3f7f3;color:#425348;position:sticky;top:0}tr:last-child td{border-bottom:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid label{font-size:13px;color:var(--muted);display:grid;gap:5px}.formgrid .wide{grid-column:1/-1}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#e9f1eb,#f7f8f7)}.login{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 45px #153b2414}.login h1{font-size:22px;margin:0 0 6px}.login label{display:grid;gap:6px;margin:14px 0;font-size:14px}.message{padding:10px 12px;border-radius:9px;background:#fff4d8;color:#684a00;margin:10px 0;font-size:13px}.message.error{background:#ffeded;color:#8c2929}.message.good{background:#e6f5e9;color:#225f34}.modalback{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:15px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto}.empty{text-align:center;padding:32px;color:var(--muted)}.receipt{font-family:monospace;width:72mm;color:#000}.receipt h2{text-align:center;font-size:17px}.receipt .rline{display:flex;justify-content:space-between;gap:8px}.receipt hr{border:0;border-top:1px dashed #555;margin:9px 0}.receipt p{font-size:12px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
// Public browser configuration only. Never put a Supabase service_role/secret key here.
const SUPABASE_URL='https://dglxqyfseshiuncchias.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_pj6i7BJKGU7NjJ0VwFMtug_uLjKKszJ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const categories=['ALL','RICE','PORK','CHICKEN','BEEF','FISH','VEGETABLE','DRINKS','ADD-ONS','OTHER'];let recipes=[],cart=[],activeCategory='ALL',sortAsc=true,profile=null,session=null,adminTab='dashboard',offlineMode=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localKey='cdp_pos_offline_queue_v1',recipesKey='cdp_pos_recipes_cache_v1';
function queueGet(){try{return JSON.parse(localStorage.getItem(localKey)||'[]')}catch{return []}}function queueSet(q){localStorage.setItem(localKey,JSON.stringify(q));updateConnection()}
function showMessage(id,msg,type=''){const el=$(id);if(el)el.innerHTML=msg?`<div class="message ${type}">${esc(msg)}</div>`:''}
function updateConnection(){const online=navigator.onLine;const pending=queueGet().length;$('connectionStatus').textContent=(online?'Online':'Offline')+(pending?` - ${pending} pending`: '');$('connectionStatus').style.background=online?'#ffffff20':'#8a5b16';}
function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userLabel').textContent=(profile?.full_name||session?.user?.email||'Cashier')+' - '+(profile?.role||'cashier');$('adminDrawerLinks').classList.toggle('hidden',profile?.role!=='admin');renderCategories();renderMenu();renderCart();updateConnection();}
function showLogin(msg=''){ $('appView').classList.add('hidden');$('loginView').classList.remove('hidden');showMessage('loginMessage',msg,msg?'error':'');}
async function loadProfile(){if(!session?.user)return null;const {data,error}=await sb.from('profiles').select('user_id,full_name,role,active').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(!data||!data.active)throw new Error('No active cashier profile is assigned to this account. Ask the admin to configure your profile.');return data;}
async function loadRecipes(){let cached=[];try{cached=JSON.parse(localStorage.getItem(recipesKey)||'[]')}catch{}if(cached.length){recipes=cached;renderMenu()}if(!navigator.onLine){if(!cached.length){recipes=[];renderMenu()}return}const {data,error}=await sb.from('recipes').select('id,name,food_type,price,description,available').eq('available',true).order('name');if(error){if(!cached.length)throw error;console.warn('Using cached menu because refresh failed:',error.message);return}recipes=data||[];localStorage.setItem(recipesKey,JSON.stringify(recipes));renderMenu();}
function renderCategories(){ $('categoryChips').innerHTML=categories.map(c=>`<button class="chip ${activeCategory===c?'active':''}" data-category="${c}">${c==='ALL'?'All':c==='ADD-ONS'?'Add-ons':c[0]+c.slice(1).toLowerCase()}</button>`).join('');$('categoryChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;renderCategories();renderMenu()});}
function renderMenu(){const search=($('menuSearch')?.value||'').trim().toLowerCase();let list=recipes.filter(r=>(activeCategory==='ALL'||r.food_type===activeCategory)&&r.name.toLowerCase().includes(search));list.sort((a,b)=>sortAsc?a.name.localeCompare(b.name):b.name.localeCompare(a.name));$('menuCount').textContent=`${list.length} items`;$('menuGrid').innerHTML=list.length?list.map(r=>`<button class="food" data-add="${r.id}"><span class="type">${esc(r.food_type)}</span><span class="foodname">${esc(r.name)}</span>${r.description?`<span class="muted" style="font-size:12px">${esc(r.description)}</span>`:''}<span class="price">${money(r.price)}</span><span class="muted" style="font-size:12px">Add to order</span></button>`).join(''):'<div class="empty">No menu items found. Admin can add items under Recipes.</div>'; $('menuGrid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));}
function addToCart(id){const r=recipes.find(x=>x.id===id);if(!r)return;const found=cart.find(x=>x.id===id);if(found)found.quantity++;else cart.push({id:r.id,name:r.name,food_type:r.food_type,price:Number(r.price),quantity:1});renderCart();}
function renderCart(){const list=$('cartList');if(!cart.length)list.innerHTML='<div class="empty">Choose items from the menu.</div>';else list.innerHTML=cart.map(x=>`<div class="cart-row"><div class="cart-row-head"><strong>${esc(x.name)}</strong><strong>${money(x.price*x.quantity)}</strong></div><div class="muted" style="font-size:12px">${money(x.price)} each</div><div class="qty"><button class="secondary small" data-dec="${x.id}">−</button><strong>${x.quantity}</strong><button class="secondary small" data-inc="${x.id}">+</button><button class="outline small" style="margin-left:auto" data-remove="${x.id}">Remove</button></div></div>`).join('');list.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>changeQty(b.dataset.inc,1));list.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>changeQty(b.dataset.dec,-1));list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.remove);renderCart()});const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);$('subtotal').textContent=money(total);$('grandTotal').textContent=money(total);updateChange();}
function changeQty(id,d){const x=cart.find(a=>a.id===id);if(!x)return;x.quantity+=d;if(x.quantity<1)cart=cart.filter(a=>a.id!==id);renderCart()}
function updateChange(){const total=cart.reduce((s,x)=>s+x.price*x.quantity,0),cash=Number($('cashReceived').value||0);$('changeDue').textContent=money(Math.max(0,cash-total));}
$('menuSearch').addEventListener('input',renderMenu);
// Voice search uses the browser's built-in Web Speech API (best supported in Chrome/Edge).
let voiceRecognition=null,voiceListening=false;
const voiceButton=$('voiceSearchBtn'),voiceStatus=$('voiceSearchStatus');
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognitionAPI){voiceButton.title='Voice search is not supported in this browser';voiceStatus.textContent='Voice search is not supported here. Try Google Chrome or Microsoft Edge.';voiceButton.addEventListener('click',()=>{voiceStatus.textContent='Voice search is not supported here. Try Google Chrome or Microsoft Edge.';});}
else {
  voiceRecognition=new SpeechRecognitionAPI();voiceRecognition.lang='en-PH';voiceRecognition.interimResults=true;voiceRecognition.continuous=false;
  voiceButton.addEventListener('click',()=>{
    if(voiceListening){voiceRecognition.stop();return;}
    try{voiceRecognition.start();}catch(e){voiceStatus.textContent='Could not start the microphone. Please try again.';}
  });
  voiceRecognition.onstart=()=>{voiceListening=true;voiceButton.classList.add('listening');voiceButton.textContent='⏹️';voiceButton.title='Stop voice search';voiceButton.setAttribute('aria-label','Stop voice search');voiceStatus.textContent='Listening… say the food name.';};
  voiceRecognition.onresult=(event)=>{let finalText='',interimText='';for(let i=event.resultIndex;i<event.results.length;i++){const text=event.results[i][0].transcript;if(event.results[i].isFinal)finalText+=text;else interimText+=text;}const spoken=(finalText||interimText).trim();if(spoken){$('menuSearch').value=spoken;renderMenu();voiceStatus.textContent=finalText?'Searching for: '+finalText:'Heard: '+spoken+'…';}};
  voiceRecognition.onerror=(event)=>{const messages={ 'not-allowed':'Microphone permission was blocked. Allow microphone access in your browser settings.', 'service-not-allowed':'Speech recognition is blocked by the browser. Try another language in the selector.', 'language-not-supported':'This browser service may not support the selected language. Try Filipino or English.', 'no-speech':'No speech detected. Tap the microphone and try again.', 'audio-capture':'No microphone was found. Check your microphone connection.'};voiceStatus.textContent=messages[event.error]||('Voice search error: '+event.error+'. Please try again.');};
  voiceRecognition.onend=()=>{voiceListening=false;voiceButton.classList.remove('listening');voiceButton.textContent='🎙️';voiceButton.title='Search by voice';voiceButton.setAttribute('aria-label','Search by voice');};
}
// Voice-command ordering: recognize a complete spoken order, review it, then add it to the existing cart.
let orderRecognition=null,orderListening=false;
const voiceOrderBtn=$('voiceOrderBtn');
function normalizeVoiceText(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
const spokenNumbers={one:1,once:1,a:1,an:1,usa:1,usaka:1,duha:2,duhaka:2,two:2,too:2,to:2,tulo:3,tuloka:3,three:3,upat:4,upatka:4,four:4,for:4,lima:5,limaka:5,five:5,unom:6,unomka:6,six:6,pito:7,pitoka:7,seven:7,walo:8,waloka:8,eight:8,ate:8,siyam:9,siyamka:9,nine:9,napulo:10,napuloka:10,ten:10};
function parseSpokenOrder(transcript){
  const parts=String(transcript||'').replace(/\b(plus|and|ug|unya)\b/gi,'|').replace(/[,;\n]+/g,'|').split('|').map(x=>x.trim()).filter(Boolean);
  const result=[],unmatched=[];
  for(let part of parts){
    let normalized=normalizeVoiceText(part).replace(/^(please\s+)?(add|order|get|i want|can i have|give me|dugangi|kuha|kuhaa|palihug|hatagi)\s+/,'').trim();
    if(!normalized)continue;
    let quantity=1;
    const qMatch=normalized.match(/^(\d+|one|once|a|an|two|too|to|three|four|for|five|six|seven|eight|ate|nine|ten|usa|usaka|duha|duhaka|tulo|tuloka|upat|upatka|lima|limaka|unom|unomka|pito|pitoka|walo|waloka|siyam|siyamka|napulo|napuloka)\s+(?:ka\s+)?(.+)$/);

    const aliasMap={'coke':['coke','coca cola','coca-cola'],'coca cola':['coca cola','coke'],'soft drink':['soft drink','soda']};
    let candidates=recipes.map(r=>({r,name:normalizeVoiceText(r.name)})).filter(x=>x.name);
    let exact=candidates.filter(x=>x.name===normalized);
    if(!exact.length){const aliases=aliasMap[normalized]||[normalized];exact=candidates.filter(x=>aliases.includes(x.name));}
    if(!exact.length){

      if(scored.length&&(!scored[1]||scored[0].score>scored[1].score))exact=[scored[0]];
    }
    if(exact.length===1)result.push({id:exact[0].r.id,name:exact[0].r.name,price:Number(exact[0].r.price),food_type:exact[0].r.food_type,quantity:Math.max(1,Math.min(99,quantity))});
    else unmatched.push(part);
  }

}

function startVoiceOrder(){

  if(!navigator.onLine){$('voiceSearchStatus').textContent='Voice ordering needs an internet connection. You can still add items manually.';return;}
  const API=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!API){$('voiceSearchStatus').textContent='Voice ordering is not supported in this browser. Try Chrome or Edge.';return;}
  if(orderListening){orderRecognition?.stop();return;}
  try{
    orderRecognition=new API();orderRecognition.lang=$('voiceOrderLanguage')?.value||'ceb-PH';orderRecognition.continuous=false;orderRecognition.interimResults=false;
    voiceOrderBtn.disabled=true;voiceOrderBtn.textContent='🎙️ Listening…';$('voiceSearchStatus').textContent='Speak your order, e.g. “duha ka rice ug usa ka adobo ug Coke”. If recognition struggles, try Filipino or English in the language selector.';
    orderRecognition.onresult=e=>{const transcript=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(transcript)showVoiceOrderReview(transcript);else $('voiceSearchStatus').textContent='No order was heard. Please try again.';};
    orderRecognition.onerror=e=>{const msg={'not-allowed':'Microphone permission was blocked. Allow microphone access in browser settings.','service-not-allowed':'Speech recognition is blocked by the browser. Try another language in the selector.', 'language-not-supported':'This browser service may not support the selected language. Try Filipino or English.','no-speech':'No speech detected. Tap Voice Order and try again.','audio-capture':'No microphone was found. Check the microphone connection.'};$('voiceSearchStatus').textContent=msg[e.error]||('Voice ordering error: '+e.error+'. Please try again.');};
    orderRecognition.onend=()=>{orderListening=false;voiceOrderBtn.disabled=false;voiceOrderBtn.textContent='🛒 Voice Order';};
    orderRecognition.onstart=()=>{orderListening=true;};orderRecognition.start();
  }catch(e){orderListening=false;voiceOrderBtn.disabled=false;voiceOrderBtn.textContent='🛒 Voice Order';$('voiceSearchStatus').textContent='Could not start voice ordering. Please try again.';}
}
